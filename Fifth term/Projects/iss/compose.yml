name: iss-stack

services:
  db:
    image: postgres:16-alpine
    container_name: iss_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iss_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  telemetry_job:
    build:
      context: ./telemetry_cli
      dockerfile: Dockerfile
    container_name: iss_telemetry_job
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CSV_OUT_DIR: /data/csv
    volumes:
      - telemetry_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  rust_iss:
    build:
      context: ./rust_iss
      dockerfile: Dockerfile
    container_name: iss_rust
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RUST_LOG: ${RUST_LOG}
      FETCH_EVERY_SECONDS: ${FETCH_EVERY_SECONDS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  php:
    build:
      context: ./php_web
      dockerfile: Dockerfile
    container_name: iss_php
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      RUST_API_URL: http://rust_iss:3000/api/iss/latest
    volumes:
      - ./php_web:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rust_iss:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: iss_nginx
    ports:
      - "8000:80"
    volumes:
      - ./php_web:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  telemetry_data:
